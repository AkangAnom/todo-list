<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Keuangan Saya</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            color: #2c3e50;
            margin-top: 0;
            text-align: center;
        }

        /* Ringkasan Saldo */
        .summary-box {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .summary-box h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #bdc3c7;
        }

        .summary-box .balance {
            font-size: 26px;
            font-weight: bold;
            margin: 0;
        }

        .inc-exp-container {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .inc-exp-container>div {
            flex: 1;
            text-align: center;
        }

        .money {
            font-size: 16px;
            font-weight: bold;
            margin-top: 5px;
        }

        .money.plus {
            color: #2ecc71;
        }

        .money.minus {
            color: #e74c3c;
        }

        /* Form Input */
        .form-control {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }

        /* Riwayat Transaksi */
        h3.section-title {
            color: #2c3e50;
            margin-top: 25px;
            margin-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 5px;
            font-size: 16px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        li {
            background-color: #f8f9fa;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 5px solid #ccc;
        }

        li.plus {
            border-right-color: #2ecc71;
        }

        li.minus {
            border-right-color: #e74c3c;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 16px;
            margin-left: 10px;
        }

        .delete-btn:hover {
            color: #c0392b;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>💰 Pencatatan Keuangan</h2>

        <!-- Ringkasan Saldo -->
        <div class="summary-box">
            <h3>Total Saldo</h3>
            <p id="saldo" class="balance">Rp 0</p>

            <div class="inc-exp-container">
                <div>
                    <span>Pemasukan</span>
                    <p id="pemasukan" class="money plus">+Rp 0</p>
                </div>
                <div>
                    <span>Pengeluaran</span>
                    <p id="pengeluaran" class="money minus">-Rp 0</p>
                </div>
            </div>
        </div>

        <!-- Form Tambah Transaksi -->
        <div class="form-control">
            <label for="keterangan">Keterangan Transaksi</label>
            <input type="text" id="keterangan" placeholder="Contoh: Gaji, Beli Kopi...">
        </div>

        <div class="form-control">
            <label for="jumlah">Jumlah (Rp)</label>
            <input type="number" id="jumlah" placeholder="Contoh: 50000">
        </div>

        <div class="form-control">
            <label for="jenis">Jenis Transaksi</label>
            <select id="jenis">
                <option value="pemasukan">Pemasukan (+)</option>
                <option value="pengeluaran">Pengeluaran (-)</option>
            </select>
        </div>

        <button class="btn-submit" onclick="tambahTransaksi()">Tambah Transaksi</button>

        <!-- Daftar Riwayat Transaksi -->
        <h3 class="section-title">Riwayat Transaksi</h3>
        <ul id="daftarTransaksi">
            <!-- Data transaksi akan muncul di sini secara dinamis -->
        </ul>
    </div>

    <script>
        // Ambil data transaksi dari LocalStorage jika ada
        let transaksi = JSON.parse(localStorage.getItem('transaksiKeuangan')) || [];

        // Inisialisasi tampilan awal
        document.addEventListener('DOMContentLoaded', updateTampilan);

        // Format angka ke mata uang Rupiah
        function formatRupiah(angka) {
            return 'Rp ' + angka.toLocaleString('id-ID');
        }

        function tambahTransaksi() {
            let ketInput = document.getElementById('keterangan');
            let jumInput = document.getElementById('jumlah');
            let jenisInput = document.getElementById('jenis');

            let ket = ketInput.value.trim();
            let jum = parseFloat(jumInput.value);
            let jenis = jenisInput.value;

            if (ket === '' || isNaN(jum) || jum <= 0) {
                alert('Silakan masukkan keterangan dan jumlah nominal yang benar!');
                return;
            }

            let itemTransaksi = {
                id: Date.now(),
                keterangan: ket,
                jumlah: jum,
                jenis: jenis
            };

            transaksi.push(itemTransaksi);
            simpanDanUpdate();

            // Kosongkan input
            ketInput.value = '';
            jumInput.value = '';
        }

        function hapusTransaksi(id) {
            transaksi = transaksi.filter(t => t.id !== id);
            simpanDanUpdate();
        }

        function simpanDanUpdate() {
            localStorage.setItem('transaksiKeuangan', JSON.stringify(transaksi));
            updateTampilan();
        }

        function updateTampilan() {
            let listEl = document.getElementById('daftarTransaksi');
            listEl.innerHTML = '';

            let totalPemasukan = 0;
            let totalPengeluaran = 0;

            transaksi.forEach(t => {
                let li = document.createElement('li');
                li.classList.add(t.jenis === 'pemasukan' ? 'plus' : 'minus');

                let simbol = t.jenis === 'pemasukan' ? '+' : '-';

                li.innerHTML = `
                    <span>${t.keterangan}</span>
                    <div>
                        <strong>${simbol}${formatRupiah(t.jumlah)}</strong>
                        <button class="delete-btn" onclick="hapusTransaksi(${t.id})" title="Hapus">❌</button>
                    </div>
                `;

                listEl.appendChild(li);

                if (t.jenis === 'pemasukan') {
                    totalPemasukan += t.jumlah;
                } else {
                    totalPengeluaran += t.jumlah;
                }
            });

            let totalSaldo = totalPemasukan - totalPengeluaran;

            document.getElementById('saldo').innerText = formatRupiah(totalSaldo);
            document.getElementById('pemasukan').innerText = '+' + formatRupiah(totalPemasukan);
            document.getElementById('pengeluaran').innerText = '-' + formatRupiah(totalPengeluaran);
        }
    </script>

</body>

</html>
